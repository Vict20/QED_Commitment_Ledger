<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>QED Commitment Ledger</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap');
:root{
  --ink:#12161c; --panel:#181d25; --panel2:#1e2530; --line:#2b3341; --line-soft:#232a35;
  --text:#e7e4da; --text-dim:#8d94a1; --text-faint:#5c6472;
  --gold:#c9a24a; --gold-dim:#8c7538;
  --met:#4f9d69; --met-bg:#16261c;
  --pending:#d4a53f; --pending-bg:#2a2214;
  --overdue:#c0553f; --overdue-bg:#2a1a15;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--ink);}
.qed{font-family:'Inter',sans-serif;color:var(--text);background:var(--ink);padding:0;}
.slab{font-family:'Spectral',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}

/* --- mobile layout --- */
.row-inner{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.row-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.add-grid{display:grid;grid-template-columns:1.4fr 0.7fr 0.7fr;gap:8px;margin-bottom:8px;}
input, select, textarea, button{font-size:16px;} /* prevents iOS auto-zoom on focus */

@media (max-width:560px){
  .header-wrap{padding:16px 14px 14px !important;}
  .header-title{font-size:19px !important;}
  .rows-wrap{padding:6px 14px !important;}
  .add-wrap{padding:12px 14px 20px !important;}
  .add-grid{grid-template-columns:1fr !important;}
  .row-card{padding:12px !important;}
  .row-inner{flex-direction:column;}
  .row-actions{flex-direction:row;align-items:center;width:100%;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line-soft);}
  .status-sel{flex:1;padding:8px 10px !important;font-size:13px;}
  .del-btn{padding:8px 14px !important;}
}
</style>
</head>
<body>
<div class="qed" style="max-width:100%;">

  <div class="header-wrap" style="border-bottom:1px solid var(--line);padding:20px 22px 16px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;">
    <div>
      <div class="mono" style="font-size:11px;letter-spacing:.12em;color:var(--gold-dim);text-transform:uppercase;">AIM: QED</div>
      <div class="slab header-title" style="font-size:22px;font-weight:600;margin-top:2px;">Commitment ledger</div>
      <div style="font-size:13px;color:var(--text-dim);margin-top:2px;">Quadrise plc — dated promises to check against future RNS</div>
    </div>
    <div style="text-align:right;">
      <div class="mono" style="font-size:11px;color:var(--text-faint);">entries</div>
      <div class="slab" id="count" style="font-size:20px;font-weight:600;">0</div>
    </div>
  </div>

  <div id="rows" class="rows-wrap" style="padding:8px 22px;"></div>

  <div class="add-wrap" style="padding:14px 22px 22px;border-top:1px solid var(--line-soft);margin-top:8px;">
    <div class="mono" style="font-size:11px;letter-spacing:.08em;color:var(--text-faint);text-transform:uppercase;margin-bottom:10px;">Add entry</div>
    <div class="add-grid">
      <input id="in-title" placeholder="e.g. OCP OEM approval received" style="background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:10px;">
      <input id="in-date" type="date" style="background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:10px;">
      <select id="in-status" style="background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:10px;">
        <option value="pending">Pending</option>
        <option value="met">Met</option>
        <option value="overdue">Overdue / slipped</option>
      </select>
    </div>
    <textarea id="in-note" placeholder="Notes — quote or paraphrase the RNS wording" style="width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:10px;min-height:60px;resize:vertical;margin-bottom:10px;"></textarea>
    <button id="add-btn" style="background:var(--gold);color:#221a05;border:none;border-radius:6px;padding:12px 18px;font-weight:600;cursor:pointer;width:100%;max-width:220px;">Add to ledger</button>
    <div><span id="save-status" class="mono" style="font-size:11px;color:var(--text-faint);">&nbsp;</span></div>
  </div>
</div>
</body>
</html>

<script>
(function(){
  const KEY = 'qed-ledger-entries';
  const rowsEl = document.getElementById('rows');
  const countEl = document.getElementById('count');
  const saveStatus = document.getElementById('save-status');

  const defaults = [
    {id:'d1', title:'Morocco: OEM approval for relocated OCP trial (kiln change, Q1 2025)', date:'2026-12-31', status:'pending', note:'Trial equipment on-site since 2025; company in active dialogue with OCP to expedite. No trial has yet run.'},
    {id:'d2', title:'Morocco: $350,000 licence fee (originally due Jan 2025)', date:'2025-01-31', status:'overdue', note:'Revised timetable agreed per Nov 2025 Final Results; payment status unconfirmed as of last update.'},
    {id:'d3', title:'Morocco: signed commercial MSAR supply agreement', date:'2026-12-31', status:'pending', note:'Deadline tied to Younes Maamar representation-agreement warrants (extended Aug 2026). Meeting to revisit by 15 Dec 2026 if missed.'},
    {id:'d4', title:'MSC / Cargill: bilateral agreements signed', date:'', status:'overdue', note:'Described as "near final form" in both June 2025 and into 2026 updates without signature.'},
    {id:'d5', title:'MSC / Cargill: commercial-scale trial commences (Antwerp)', date:'', status:'pending', note:'Originally targeted Q1 2025, then Q3 2025 — both missed. No firm date as of latest update.'},
    {id:'d6', title:'Cash runway funded through', date:'2027-06-30', status:'pending', note:'Per July 2026 placing/subscription document, assuming milestones land on schedule.'},
    {id:'d7', title:'Positive company-wide cashflow guided', date:'2029-06-30', status:'pending', note:'FY2028-29 per July 2026 fundraise documentation — end of range.'},
    {id:'d8', title:'Panama: Sparkle Power Fuel Supply Agreement signed', date:'', status:'pending', note:'Trial at El Giral plant concluded successfully July 2025 (first use on Everllence/MAN 4-stroke engines). FY25 report says "planning next steps towards fuel permitting and commercial supply" — no Fuel Supply Agreement yet as of latest update.'},
    {id:'d9', title:'Utah/Valkor: $0.30m licence fee payment', date:'2026-03-31', status:'pending', note:'Part of renegotiated $1.0m fee schedule after original $350k (due Jan 2025) went unpaid. $50k paid immediately on renegotiation per Nov 2025 report.'},
    {id:'d10', title:'Utah/Valkor: remaining $0.65m licence fee payment', date:'2026-06-30', status:'pending', note:'Final tranche of the renegotiated $1.0m licence fee.'},
    {id:'d11', title:'Utah/Valkor: $0.2m payment for 600bpd MMU delivery', date:'2026-09-30', status:'pending', note:'Additional $0.3m due on later delivery of a full-scale 6,000bpd MMU (no date given).'},
    {id:'d12', title:'Utah/Valkor: quarterly $75k support payments begin', date:'2026-07-01', status:'pending', note:'Minimum two years of quarterly payments starting Q3 2026, per renegotiated terms.'},
    {id:'d13', title:'Utah/Valkor: 500bpd oil-sands pilot plant operational', date:'2026-12-31', status:'pending', note:'Guided for Q4 2026 per March 2026 company update. Oil samples for Quadrise testing were expected Q2 2026.'},
    {id:'d14', title:'Aggregate ~$1.5m Valkor receipts assumed in cash forecasts', date:'2026-12-31', status:'pending', note:'FY25 annual report flags this as a going-concern risk: "there remains a risk that the $1.5m from Valkor is either not received, reduced in amount, or is significantly delayed."'},
    {id:'d15', title:'TRACKED SLIP: positive cashflow date moved once already', date:'2027-06-30', status:'overdue', note:'FY25 annual report (Sept 2025) said positive cashflows "now forecast to commence in Q1 2027." July 2026 placing doc instead guided runway to 30 Jun 2027 with positive cashflow implied around FY2028-29 — a slip of well over a year in under 10 months. Watch for further movement.'},
    {id:'d16', title:'MSC: commercial-scale bioMSAR trial aboard Leandra V', date:'2026-03-31', status:'overdue', note:'FY25 annual report (Sept 2025) stated the trial was "planned for early 2026." Bilateral MSC/Cargill agreements still unsigned as of latest update, so this date has passed without the trial starting.'},
    {id:'d17', title:'Refinery supply agreement signed (any of 4 in active discussion)', date:'', status:'pending', note:'New workstream disclosed in July 2026 placing document under Peter Borup\u2019s revised strategy — "active discussions with four strategically located refineries." No agreement yet; refineries would be the actual production partners under Quadrise\u2019s licensing model.'},
    {id:'d18', title:'Morocco: revised OCP alternative-site trial plan signed', date:'2026-04-30', status:'overdue', note:'March 2026 interim results said OCP and Quadrise "reaffirmed their commitment to MSAR trials at an alternative site, with a revised trial plan expected to be signed shortly." Still unsigned as of the July 2026 fundraise document, which described the plan as still "in negotiation."'},
    {id:'d19', title:'TRACKED SLIP: Valkor 500bpd pilot plant operational date moved', date:'2026-12-31', status:'overdue', note:'AGM update (28 Nov 2025) guided Q2 2026. Interim results (26 Mar 2026) revised this to Q4 2026 — a slip of two quarters in four months. Oil-sample testing date for Quadrise also moved from Q1 2026 to Q2 2026 across the same two statements.'}
  ];

  function load(){
    try{
      const raw = localStorageFallback();
      return raw;
    }catch(e){ return null; }
  }
  function localStorageFallback(){ return null; }

  let entries = [];

  async function init(){
    try{
      const raw = localStorage.getItem(KEY);
      entries = raw ? JSON.parse(raw) : defaults;
    }catch(e){
      entries = defaults;
    }
    render();
  }

  async function persist(){
    saveStatus.textContent = 'saving…';
    try{
      localStorage.setItem(KEY, JSON.stringify(entries));
      saveStatus.textContent = 'saved';
      setTimeout(()=>{ saveStatus.textContent=''; }, 1200);
    }catch(e){
      saveStatus.textContent = 'save failed';
    }
  }

  function statusMeta(s){
    if(s==='met') return {label:'Met', color:'var(--met)', bg:'var(--met-bg)'};
    if(s==='overdue') return {label:'Overdue', color:'var(--overdue)', bg:'var(--overdue-bg)'};
    return {label:'Pending', color:'var(--pending)', bg:'var(--pending-bg)'};
  }

  function fmtDate(d){
    if(!d) return 'no fixed date';
    const dt = new Date(d+'T00:00:00');
    if(isNaN(dt)) return d;
    return dt.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  }

  function render(){
    rowsEl.innerHTML = '';
    countEl.textContent = entries.length;
    entries.forEach((e,idx)=>{
      const meta = statusMeta(e.status);
      const row = document.createElement('div');
      row.className = 'row-card';
      row.style.cssText = 'border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;margin-bottom:8px;background:var(--panel);';
      row.innerHTML = `
        <div class="row-inner">
          <div style="flex:1;min-width:0;">
            <div style="font-size:14px;font-weight:500;line-height:1.4;">${escapeHtml(e.title)}</div>
            <div class="mono" style="font-size:11px;color:var(--text-faint);margin-top:4px;">target: ${fmtDate(e.date)}</div>
            ${e.note ? `<div style="font-size:12.5px;color:var(--text-dim);margin-top:6px;line-height:1.5;">${escapeHtml(e.note)}</div>` : ''}
          </div>
          <div class="row-actions">
            <select data-idx="${idx}" class="status-sel mono" style="background:${meta.bg};color:${meta.color};border:1px solid ${meta.color};border-radius:5px;padding:4px 8px;font-size:11px;font-weight:600;cursor:pointer;">
              <option value="pending" ${e.status==='pending'?'selected':''}>Pending</option>
              <option value="met" ${e.status==='met'?'selected':''}>Met</option>
              <option value="overdue" ${e.status==='overdue'?'selected':''}>Overdue</option>
            </select>
            <button data-idx="${idx}" class="del-btn mono" style="background:none;border:1px solid var(--line);color:var(--text-faint);border-radius:5px;padding:3px 8px;font-size:11px;cursor:pointer;">remove</button>
          </div>
        </div>`;
      rowsEl.appendChild(row);
    });

    rowsEl.querySelectorAll('.status-sel').forEach(sel=>{
      sel.addEventListener('change', (ev)=>{
        const i = parseInt(ev.target.getAttribute('data-idx'));
        entries[i].status = ev.target.value;
        persist();
        render();
      });
    });
    rowsEl.querySelectorAll('.del-btn').forEach(btn=>{
      btn.addEventListener('click', (ev)=>{
        const i = parseInt(ev.target.getAttribute('data-idx'));
        entries.splice(i,1);
        persist();
        render();
      });
    });
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  document.getElementById('add-btn').addEventListener('click', ()=>{
    const title = document.getElementById('in-title').value.trim();
    const date = document.getElementById('in-date').value;
    const status = document.getElementById('in-status').value;
    const note = document.getElementById('in-note').value.trim();
    if(!title){
      document.getElementById('in-title').style.borderColor = 'var(--overdue)';
      return;
    }
    entries.unshift({id:'e'+Date.now(), title, date, status, note});
    document.getElementById('in-title').value = '';
    document.getElementById('in-date').value = '';
    document.getElementById('in-note').value = '';
    document.getElementById('in-title').style.borderColor = 'var(--line)';
    persist();
    render();
  });

  init();
})();
</script>
